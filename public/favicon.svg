<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#FFF7FB"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#FFE5F7" stroke-width="2"/>
  
  <!-- "P" Stylized Script -->
  <text x="8" y="32" 
        font-family="'Brush Script MT', 'Playfair Display', cursive, sans-serif" 
        font-size="28" 
        font-weight="bold" 
        font-style="italic" 
        stroke="#5C284D" 
        stroke-width="2" 
        fill="#FBD5E5">
    P
  </text>

  <!-- "SMILE" text -->
  <text x="24" y="38" 
        font-family="'Arial Rounded MT Bold', sans-serif" 
        font-size="18" 
        font-weight="900" 
        letter-spacing="1" 
        stroke="#5C284D" 
        stroke-width="1.5" 
        fill="#F7A8C8">
    SMILE
  </text>

  <!-- Smile Arc -->
  <path d="M 22 46 Q 38 54 52 46" 
        stroke="#5C284D" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        fill="none" />
</svg>
