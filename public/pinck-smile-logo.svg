<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filter for soft subtle shadow if needed -->
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D98AAF" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="translate(10, 20)">
    <!-- 1. "Pinck" in Cursive Calligraphic Style with Dual Stroke / Fill -->
    <g transform="rotate(-7 130 90)">
      <!-- Base Shadow / Outer stroke -->
      <text x="35" y="105" 
            font-family="'Brush Script MT', 'Dancing Script', 'Playfair Display', 'Caveat', cursive, sans-serif" 
            font-size="96" 
            font-weight="bold"
            font-style="italic" 
            letter-spacing="2"
            stroke="#5C284D" 
            stroke-width="10" 
            stroke-linejoin="round"
            stroke-linecap="round"
            fill="#5C284D">
        Pinck
      </text>
      <!-- Inner Pink Fill -->
      <text x="35" y="105" 
            font-family="'Brush Script MT', 'Dancing Script', 'Playfair Display', 'Caveat', cursive, sans-serif" 
            font-size="96" 
            font-weight="bold"
            font-style="italic" 
            letter-spacing="2"
            stroke="#F5A3C7" 
            stroke-width="3" 
            fill="#FBD5E5">
        Pinck
      </text>
    </g>

    <!-- 2. Tagline "Female Mood Booster" -->
    <text x="285" y="86" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="16" 
          font-weight="600" 
          letter-spacing="0.5" 
          fill="#5C284D">
      Female Mood Booster
    </text>

    <!-- 3. "SMILE" Bubble / Chunky Rounded Capital Typography -->
    <!-- Outer Outline -->
    <text x="180" y="172" 
          font-family="'Arial Rounded MT Bold', 'Nunito', 'Fredoka', 'Plus Jakarta Sans', sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="6" 
          stroke="#5C284D" 
          stroke-width="7" 
          stroke-linejoin="round"
          fill="#5C284D">
      SMILE
    </text>
    <!-- Inner Bubble Fill -->
    <text x="180" y="172" 
          font-family="'Arial Rounded MT Bold', 'Nunito', 'Fredoka', 'Plus Jakarta Sans', sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="6" 
          fill="#F7A8C8">
      SMILE
    </text>

    <!-- 4. Characteristic Smile Curve with Dimple Accents -->
    <!-- Left Dimple -->
    <path d="M 232 196 C 228 190 223 189 220 194" 
          stroke="#5C284D" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          fill="none" />
    
    <!-- Smile Arc -->
    <path d="M 226 200 Q 320 252 410 200" 
          stroke="#5C284D" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          fill="none" />

    <!-- Right Dimple -->
    <path d="M 404 200 C 408 190 415 189 418 194" 
          stroke="#5C284D" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          fill="none" />
  </g>
</svg>
